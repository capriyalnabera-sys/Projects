name: Build Ind AS 116 Lease App (Windows .exe)

on:
  push:
    branches: [My-Projects]
    paths:
      - "ind_as116_lease_app/**"
      - ".github/workflows/build-lease-app-exe.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ind_as116_lease_app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run accounting tests
        run: python -m pytest -q tests

      - name: Build a single self-contained .exe with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name IndAS116LeaseApp
          --exclude-module PySide6.QtWebEngineCore --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module tkinter
          main.py

      - name: Launch the built .exe (self-test on Windows)
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath "dist\IndAS116LeaseApp.exe" -ArgumentList "--self-test" -Wait -PassThru
          $log = Join-Path $env:LOCALAPPDATA "IndAS116LeaseApp\self_test.log"
          if (Test-Path $log) { Get-Content $log }
          $err = Join-Path $env:LOCALAPPDATA "IndAS116LeaseApp\startup_error.log"
          if (Test-Path $err) { Get-Content $err }
          Write-Host "Exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Launch the .exe alone from an empty folder (as when started from inside a ZIP)
        timeout-minutes: 5
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "lone_exe"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item dist\IndAS116LeaseApp.exe $dir
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:LOCALAPPDATA "IndAS116LeaseApp\self_test.log")
          $p = Start-Process -FilePath (Join-Path $dir "IndAS116LeaseApp.exe") -ArgumentList "--self-test" -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          Get-Content (Join-Path $env:LOCALAPPDATA "IndAS116LeaseApp\self_test.log")
          Write-Host "Exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Package the application folder
        run: |
          $pkg = "package\IndAS116LeaseApp"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item dist\IndAS116LeaseApp.exe $pkg
          Copy-Item -Recurse templates "$pkg\Excel_Templates"
          Copy-Item -Recurse sample_data "$pkg\Sample_Data"
          New-Item -ItemType Directory -Force "$pkg\Documents" | Out-Null
          Copy-Item docs\USER_MANUAL.md, docs\ACCOUNTING_METHOD.md, docs\PHASE1_DEMO_APRIL_2027.md, docs\Accounting_Test_Results.xlsx "$pkg\Documents"
          @"
          Ind AS 116 Lease Accounting - Windows desktop application
          ==========================================================
          1. Right-click the downloaded ZIP > Extract All, e.g. to C:\LeaseApp.
          2. Double-click IndAS116LeaseApp.exe (single file - no Python or internet needed).
             The first start takes 5-10 seconds while Windows unpacks it.
          3. If Windows SmartScreen warns about an unknown publisher: More info > Run anyway.
          4. Load the demo leases: Settings > Load sample (demo) data.
             Then Monthly Accounting > April 2027 > Generate monthly entries.
          Data is stored in %LOCALAPPDATA%\IndAS116LeaseApp (backups in the 'backups' sub-folder).
          "@ | Set-Content "$pkg\READ_ME_FIRST.txt"

      # uploaded as a folder: GitHub zips it once, so the download is a single ZIP (no ZIP inside a ZIP)
      - uses: actions/upload-artifact@v4
        with:
          name: IndAS116LeaseApp-Windows
          path: ind_as116_lease_app/package/
          retention-days: 90
