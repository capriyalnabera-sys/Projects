risk_profile: balanced_aggressive

telegram:
  api_id: 0
  api_hash: ""
  session_name: stock_analyzer
  groups: []

recommendation:
  technical_weight: 0.45
  fundamental_weight: 0.45
  telegram_weight: 0.10

cache:
  dir: data/cache
  ttl_minutes: 60

# F&O module. Lot sizes are exchange-notified and revised a few times a year —
# override here when they change (no code edit needed).
fno:
  # Indices the background tracker snapshots during market hours (powers the
  # intraday tracker, signal-change alerts, and the signal track record).
  track_symbols: [NIFTY, BANKNIFTY, SENSEX]
  track_interval_minutes: 5
  alerts:
    # true = also send each signal flip to your own Telegram Saved Messages
    # (needs the telegram api_id/api_hash above to be configured).
    telegram: false
  lot_sizes:
    NIFTY: 75
    BANKNIFTY: 35
    FINNIFTY: 65
    MIDCPNIFTY: 140
    SENSEX: 20
