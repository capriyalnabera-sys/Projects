risk_profile: balanced_aggressive

telegram:
  api_id: 0
  api_hash: ""
  session_name: stock_analyzer
  groups: []

recommendation:
  technical_weight: 0.45
  fundamental_weight: 0.45
  telegram_weight: 0.10
  # Macro tilt (crude, USD/INR, US yields, dollar, copper, gold, S&P 500, FII
  # flows) mapped through each stock's sector. Stock macro score is ±1.5 at
  # most, so 0.25 moves the combined score by at most ±0.375.
  macro_weight: 0.25

# Macro factors (src/macro.py). Optional: RBI policy direction, which feeds the
# interest-rate factor alongside the US 10Y yield — cutting | hold | hiking.
macro:
  enabled: true
  # repo_trend: hold

# ALL UNIVERSE = every NSE (main board + SME) and BSE stock with market cap at
# or above this floor, rebuilt on each "Refresh all".
universe:
  min_market_cap_cr: 500

cache:
  dir: data/cache
  ttl_minutes: 60

# F&O module. Lot sizes are exchange-notified and revised a few times a year —
# override here when they change (no code edit needed).
fno:
  # Indices the background tracker snapshots during market hours (powers the
  # intraday tracker, signal-change alerts, and the signal track record).
  track_symbols: [NIFTY, BANKNIFTY, SENSEX]
  track_interval_minutes: 5
  alerts:
    # true = also send each signal flip to your own Telegram Saved Messages
    # (needs the telegram api_id/api_hash above to be configured).
    telegram: false
  lot_sizes:
    NIFTY: 75
    BANKNIFTY: 35
    FINNIFTY: 65
    MIDCPNIFTY: 140
    SENSEX: 20


# Price history source. The exchanges' own daily price files cover every
# listed stock (no per-stock requests, no Yahoo throttling). The first run
# downloads ~2 years in the background; Yahoo fills in anything not covered.
prices:
  nse_files: true
  bse_files: true
  history_calendar_days: 760
