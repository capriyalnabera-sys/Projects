<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Stock Analyzer{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f8fa;
    --panel: #ffffff;
    --panel-soft: #f1f3f6;
    --text: #111827;
    --text-soft: #374151;
    --muted: #6b7280;
    --muted-soft: #838a95;  /* was #9ca3af — darkened for WCAG contrast on white */
    --border: #e5e7eb;
    --border-soft: #eef0f3;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --green: #15803d;
    --green-soft: #dcfce7;
    --green-bright: #22c55e;
    --yellow: #92400e;
    --yellow-soft: #fef3c7;
    --yellow-bright: #f59e0b;
    --orange: #c2410c;
    --orange-soft: #ffedd5;
    --red: #b91c1c;
    --red-soft: #fee2e2;
    --red-bright: #ef4444;
    --purple: #7c3aed;
    --purple-soft: #ede9fe;

    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 3px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 2px 4px rgba(15, 23, 42, 0.04), 0 4px 12px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 4px 8px rgba(15, 23, 42, 0.05), 0 12px 24px rgba(15, 23, 42, 0.08);

    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11","ss01";
    line-height: 1.55; font-size: 14px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Tabular numerals for tables, money cells, and any data display. */
  table, .num, td[data-val], .scores b, .verdict, .ratio .val,
  .pos, .neg, .neutral, .stock-hero, .ratios-strip {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum","cv02","cv03","cv04";
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 22px 80px; }

  h1, h2, h3 { color: var(--text); font-weight: 600; letter-spacing: -0.015em; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 a { color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  h2 { font-size: 16px; margin: 0 0 10px; letter-spacing: -0.01em; }
  h3 { font-size: 13px; margin: 0 0 8px; }

  ::selection { background: var(--accent-soft); color: var(--accent); }

  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Header band ------------------------------------------------------------ */
  .app-header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(255,255,255,0.85);
    backdrop-filter: saturate(1.5) blur(10px);
    -webkit-backdrop-filter: saturate(1.5) blur(10px);
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .app-header-inner { max-width: 1200px; margin: 0 auto; padding: 14px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-weight: 700; font-size: 16px; text-decoration: none; }
  .brand .brand-mark { width: 30px; height: 30px; border-radius: 8px; background: linear-gradient(135deg, var(--accent) 0%, #4f46e5 50%, #7c3aed 100%); display: inline-flex; align-items: center; justify-content: center; color: #fff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25); }
  .nav-links { display: inline-flex; align-items: center; gap: 4px; }
  .nav-link { padding: 6px 12px; border-radius: var(--radius-sm); color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
  .nav-link:hover { background: var(--panel-soft); color: var(--text); text-decoration: none; }
  .nav-link.active { background: var(--accent-soft); color: var(--accent); }

  /* Accessibility ---------------------------------------------------------- */
  /* Visible keyboard focus everywhere (mouse clicks stay clean via :focus-visible) */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .skip-link {
    position: absolute; left: -9999px; top: 0; z-index: 100;
    background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 0 0 8px 0;
    font-weight: 600; font-size: 13px;
  }
  .skip-link:focus { left: 0; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* Phone layout (tool is reached via Tailscale/LAN from mobiles) ----------- */
  @media (max-width: 640px) {
    .app-header-inner { flex-wrap: wrap; padding: 10px 14px; gap: 8px; }
    .nav-links { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .nav-link { padding: 10px 14px; font-size: 14px; flex-shrink: 0; }  /* ≥44px tap target */
    .wrap { padding: 16px 12px 60px; }
    .topbar { flex-wrap: wrap; gap: 10px; }
    table { font-size: 12px; }
  }

  /* Inputs / buttons ------------------------------------------------------- */
  input[type="text"], input[type="number"], select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: var(--radius-sm); font-size: 14px; font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"] { width: 100%; }
  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
  }
  button, .btn {
    background: var(--accent); color: #fff; border: 0; padding: 8px 16px; border-radius: var(--radius-sm);
    font-weight: 600; cursor: pointer; font-size: 13px; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.15s, transform 0.05s, box-shadow 0.15s;
    box-shadow: var(--shadow-sm);
  }
  button:hover, .btn:hover { background: #1d4ed8; }
  button:active, .btn:active { transform: translateY(1px); }
  button.secondary, .btn.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover, .btn.secondary:hover { background: var(--panel-soft); }

  label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  label input[type="checkbox"] { accent-color: var(--accent); }

  .form-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .examples { font-size: 12px; color: var(--muted); }
  .examples a { margin-right: 12px; }

  /* Cards ------------------------------------------------------------------ */
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 18px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.15s, transform 0.05s;
  }
  .card:hover { box-shadow: var(--shadow-md); }

  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

  /* Verdict badges --------------------------------------------------------- */
  .verdict {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 4px; font-weight: 700; font-size: 11px; letter-spacing: 0.5px;
  }
  .verdict.BUY        { background: var(--green-soft); color: var(--green); }
  .verdict.ACCUMULATE { background: var(--green-soft); color: var(--green); }
  .verdict.HOLD       { background: var(--yellow-soft); color: var(--yellow); }
  .verdict.REDUCE     { background: var(--orange-soft); color: var(--orange); }
  .verdict.AVOID      { background: var(--red-soft); color: var(--red); }

  /* Color helpers ---------------------------------------------------------- */
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neutral { color: var(--muted); }

  /* Grid + alerts ---------------------------------------------------------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 24px; margin-top: 14px; }
  .grid div span { color: var(--muted); display: inline-block; min-width: 130px; }

  .alert {
    background: var(--yellow-soft); color: var(--yellow);
    border-left: 3px solid var(--yellow-bright);
    padding: 10px 14px; border-radius: var(--radius-sm); margin: 14px 0; font-size: 13px;
    display: flex; align-items: center; gap: 8px;
  }

  .rationale { background: var(--panel-soft); border-radius: var(--radius-sm); padding: 10px 16px; margin-top: 14px; font-size: 13px; }
  .rationale ul { margin: 4px 0; padding-left: 20px; }
  .rationale li { margin: 3px 0; }

  .scores { display: flex; gap: 24px; margin-top: 8px; font-size: 13px; flex-wrap: wrap; }
  .scores .s { color: var(--muted); display: inline-flex; align-items: baseline; gap: 4px; }
  .scores .s b { color: var(--text); font-weight: 600; }

  .errors { background: var(--red-soft); color: var(--red); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 13px; }

  .disclaimer { color: var(--muted); font-size: 11px; margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .topbar form { flex: 1; min-width: 280px; }

  .pill { background: var(--panel-soft); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }

  /* Lucide icon sizing ----------------------------------------------------- */
  [data-lucide] { width: 16px; height: 16px; stroke-width: 2; vertical-align: -3px; }
  .icon-sm [data-lucide] { width: 14px; height: 14px; }
  .icon-lg [data-lucide] { width: 20px; height: 20px; }
  .icon-xl [data-lucide] { width: 28px; height: 28px; }

  /* Subtle entrance animation --------------------------------------------- */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .card, .pick { animation: fadeInUp 0.25s ease-out both; }
</style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to content</a>

<header class="app-header">
  <div class="app-header-inner">
    <a href="/" class="brand" aria-label="Stock Analyzer home">
      <span class="brand-mark" aria-hidden="true"><i data-lucide="line-chart"></i></span>
      Stock Analyzer <span class="pill" style="font-weight:600;">2.0</span>
    </a>
    <nav class="nav-links" aria-label="Primary">
      <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}" {% if request.path == '/' %}aria-current="page"{% endif %}><i data-lucide="layout-dashboard" aria-hidden="true"></i>Recommendations</a>
      <a href="/market" class="nav-link {% if request.path.startswith('/market') %}active{% endif %}" {% if request.path.startswith('/market') %}aria-current="page"{% endif %}><i data-lucide="activity" aria-hidden="true"></i>Market Pulse</a>
      <a href="/fno" class="nav-link {% if request.path.startswith('/fno') %}active{% endif %}" {% if request.path.startswith('/fno') %}aria-current="page"{% endif %}><i data-lucide="candlestick-chart" aria-hidden="true"></i>F&amp;O</a>
      <a href="/screener" class="nav-link {% if request.path.startswith('/screener') %}active{% endif %}" {% if request.path.startswith('/screener') %}aria-current="page"{% endif %}><i data-lucide="filter" aria-hidden="true"></i>Screener</a>
      <a href="/accuracy" class="nav-link {% if request.path.startswith('/accuracy') %}active{% endif %}" {% if request.path.startswith('/accuracy') %}aria-current="page"{% endif %}><i data-lucide="target" aria-hidden="true"></i>Accuracy</a>
      <a href="/analyze" class="nav-link {% if request.path == '/analyze' %}active{% endif %}" {% if request.path == '/analyze' %}aria-current="page"{% endif %}><i data-lucide="search" aria-hidden="true"></i>Analyze</a>
    </nav>
  </div>
</header>

<main class="wrap" id="main-content">
  {% block content %}{% endblock %}
  <div class="disclaimer" role="note">
    <i data-lucide="info" aria-hidden="true"></i>
    Output is heuristic and may be wrong, stale, or based on incomplete data. Do your own due diligence. Not SEBI-registered. Markets are risky.
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  if (window.lucide) { lucide.createIcons(); }

  // Indian number format helpers — used across pages.
  // 12,34,567.89 (lakh-crore comma style) and ₹X Cr / ₹X L abbreviations.
  window.fmtINR = function(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const sign = n < 0 ? '-' : '';
    const v = Math.abs(n);
    return sign + v.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  };
  window.fmtINRCompact = function(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const sign = n < 0 ? '-' : '';
    const v = Math.abs(n);
    if (v >= 1e7)  return sign + '₹' + (v / 1e7).toFixed(2) + ' Cr';
    if (v >= 1e5)  return sign + '₹' + (v / 1e5).toFixed(2) + ' L';
    if (v >= 1e3)  return sign + '₹' + (v / 1e3).toFixed(1) + 'k';
    return sign + '₹' + v.toFixed(2);
  };
  window.fmtPct = function(n, withSign) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return ((withSign && n > 0) ? '+' : '') + n.toFixed(2) + '%';
  };
</script>
</body>
</html>
