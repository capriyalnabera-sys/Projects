<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Stock Analyzer{% endblock %}</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Apply the saved theme BEFORE first paint to avoid a flash. No value stored
  // means "follow the OS" (no data-theme attribute).
  (function () {
    try {
      var t = localStorage.getItem("sa-theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ---- Design tokens ----------------------------------------------------
     Light and dark are each deliberately chosen (not an automatic flip).
     Dark applies via the OS preference unless the viewer stamped a theme
     with the toggle; the stamp wins both ways. Legacy variable names
     (--green, --red-soft, …) are kept so every page keeps working. */
  :root {
    color-scheme: light;
    --bg: #f9f9f7;            /* page plane */
    --panel: #fcfcfb;         /* card surface */
    --panel-soft: #f1f0ec;
    --text: #0b0b0b;
    --text-soft: #52514e;
    --muted: #6f6d67;
    --muted-soft: #898781;
    --border: #e1e0d9;
    --border-soft: #eceae4;

    --accent: #2a78d6;
    --accent-soft: rgba(42, 120, 214, 0.10);
    --accent-ink: #ffffff;

    --green: #006300;                       /* positive text/ink */
    --green-bright: #0ca30c;                /* positive marks (bars, dots) */
    --green-soft: rgba(12, 163, 12, 0.11);
    --red: #c23434;                         /* negative text/ink */
    --red-bright: #d03b3b;                  /* negative marks */
    --red-soft: rgba(208, 59, 59, 0.10);
    --yellow: #8a5a00;
    --yellow-bright: #fab219;
    --yellow-soft: rgba(250, 178, 25, 0.16);
    --orange: #a4470e;
    --orange-soft: rgba(236, 131, 90, 0.15);
    --purple: #4a3aa7;
    --purple-soft: rgba(74, 58, 167, 0.10);

    --chart-grid: #e7e6df;
    --chart-tick: #898781;

    --header-bg: rgba(252, 252, 251, 0.82);
    --shadow-sm: 0 1px 2px rgba(15, 20, 25, 0.04), 0 1px 3px rgba(15, 20, 25, 0.05);
    --shadow-md: 0 2px 4px rgba(15, 20, 25, 0.04), 0 4px 14px rgba(15, 20, 25, 0.06);
    --shadow-lg: 0 4px 8px rgba(15, 20, 25, 0.05), 0 12px 28px rgba(15, 20, 25, 0.08);
    --radius: 12px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #0d0d0d;
      --panel: #1a1a19;
      --panel-soft: #242422;
      --text: #f4f4f2;
      --text-soft: #c3c2b7;
      --muted: #a3a29a;
      --muted-soft: #898781;
      --border: #2c2c2a;
      --border-soft: #232321;

      --accent: #3987e5;
      --accent-soft: rgba(57, 135, 229, 0.16);
      --accent-ink: #ffffff;

      --green: #0ca30c;
      --green-bright: #0ca30c;
      --green-soft: rgba(12, 163, 12, 0.16);
      --red: #e66767;
      --red-bright: #d03b3b;
      --red-soft: rgba(230, 103, 103, 0.13);
      --yellow: #fab219;
      --yellow-bright: #fab219;
      --yellow-soft: rgba(250, 178, 25, 0.12);
      --orange: #ec835a;
      --orange-soft: rgba(236, 131, 90, 0.13);
      --purple: #9085e9;
      --purple-soft: rgba(144, 133, 233, 0.14);

      --chart-grid: #262624;
      --chart-tick: #898781;

      --header-bg: rgba(13, 13, 13, 0.80);
      --shadow-sm: none;
      --shadow-md: none;
      --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0d;
    --panel: #1a1a19;
    --panel-soft: #242422;
    --text: #f4f4f2;
    --text-soft: #c3c2b7;
    --muted: #a3a29a;
    --muted-soft: #898781;
    --border: #2c2c2a;
    --border-soft: #232321;

    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.16);
    --accent-ink: #ffffff;

    --green: #0ca30c;
    --green-bright: #0ca30c;
    --green-soft: rgba(12, 163, 12, 0.16);
    --red: #e66767;
    --red-bright: #d03b3b;
    --red-soft: rgba(230, 103, 103, 0.13);
    --yellow: #fab219;
    --yellow-bright: #fab219;
    --yellow-soft: rgba(250, 178, 25, 0.12);
    --orange: #ec835a;
    --orange-soft: rgba(236, 131, 90, 0.13);
    --purple: #9085e9;
    --purple-soft: rgba(144, 133, 233, 0.14);

    --chart-grid: #262624;
    --chart-tick: #898781;

    --header-bg: rgba(13, 13, 13, 0.80);
    --shadow-sm: none;
    --shadow-md: none;
    --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.45);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11","ss01";
    line-height: 1.55; font-size: 14px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* Tabular numerals only where digits must align in columns. */
  table, .num, td[data-val], .scores b, .ratio .val, .ratios-strip {
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum","cv02","cv03","cv04";
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 26px 22px 80px; }

  h1, h2, h3 { color: var(--text); font-weight: 600; letter-spacing: -0.015em; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h1 a { color: var(--text); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
  h2 { font-size: 15px; margin: 0 0 12px; letter-spacing: -0.01em; display: flex; align-items: center; gap: 7px; }
  h3 { font-size: 12px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }

  ::selection { background: var(--accent-soft); color: var(--accent); }

  .sub { color: var(--muted); font-size: 13px; margin-bottom: 22px; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Header ---------------------------------------------------------------- */
  .app-header {
    position: sticky; top: 0; z-index: 50;
    background: var(--header-bg);
    backdrop-filter: saturate(1.4) blur(12px);
    -webkit-backdrop-filter: saturate(1.4) blur(12px);
    border-bottom: 1px solid var(--border);
    margin-bottom: 22px;
  }
  .app-header-inner { max-width: 1200px; margin: 0 auto; padding: 12px 22px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--text); font-weight: 700; font-size: 15px; text-decoration: none; letter-spacing: -0.01em; }
  .brand:hover { text-decoration: none; }
  .brand .brand-mark {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--accent) 0%, #6d5ae0 100%);
    display: inline-flex; align-items: center; justify-content: center; color: #fff;
    box-shadow: 0 2px 10px rgba(57, 105, 229, 0.30);
  }
  .brand .ver { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 2px 6px; }
  .header-right { display: inline-flex; align-items: center; gap: 8px; }
  .nav-links { display: inline-flex; align-items: center; gap: 2px; }
  .nav-link { padding: 7px 11px; border-radius: 8px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; }
  .nav-link:hover { background: var(--panel-soft); color: var(--text); text-decoration: none; }
  .nav-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .theme-toggle {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    width: 32px; height: 32px; border-radius: 8px; padding: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    box-shadow: none;
  }
  .theme-toggle:hover { background: var(--panel-soft); color: var(--text); }
  .theme-toggle [data-lucide="sun"] { display: none; }
  .theme-toggle [data-lucide="moon"] { display: inline-block; }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .theme-toggle [data-lucide="sun"] { display: inline-block; }
    :root:where(:not([data-theme="light"])) .theme-toggle [data-lucide="moon"] { display: none; }
  }
  :root[data-theme="dark"] .theme-toggle [data-lucide="sun"] { display: inline-block; }
  :root[data-theme="dark"] .theme-toggle [data-lucide="moon"] { display: none; }

  /* Accessibility ---------------------------------------------------------- */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .skip-link {
    position: absolute; left: -9999px; top: 0; z-index: 100;
    background: var(--accent); color: #fff; padding: 10px 16px; border-radius: 0 0 8px 0;
    font-weight: 600; font-size: 13px;
  }
  .skip-link:focus { left: 0; text-decoration: none; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }

  /* Phone layout ----------------------------------------------------------- */
  @media (max-width: 640px) {
    .app-header-inner { flex-wrap: wrap; padding: 10px 14px; gap: 8px; }
    .header-right { width: 100%; justify-content: space-between; }
    .nav-links { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
    .nav-link { padding: 10px 12px; font-size: 13px; flex-shrink: 0; }
    .wrap { padding: 16px 12px 60px; }
    .topbar { flex-wrap: wrap; gap: 10px; }
    table { font-size: 12px; }
  }

  /* Inputs / buttons -------------------------------------------------------- */
  input[type="text"], input[type="number"], select {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 9px 12px; border-radius: var(--radius-sm); font-size: 14px; font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"] { width: 100%; }
  input[type="text"]:focus, input[type="number"]:focus, select:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button, .btn {
    background: var(--accent); color: var(--accent-ink); border: 0; padding: 8px 16px; border-radius: var(--radius-sm);
    font-weight: 600; cursor: pointer; font-size: 13px; font-family: inherit;
    display: inline-flex; align-items: center; gap: 6px;
    transition: filter 0.15s, transform 0.05s;
    box-shadow: var(--shadow-sm);
  }
  button:hover, .btn:hover { filter: brightness(1.08); text-decoration: none; }
  button:active, .btn:active { transform: translateY(1px); }
  button.secondary, .btn.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover, .btn.secondary:hover { background: var(--panel-soft); filter: none; }

  label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  label input[type="checkbox"] { accent-color: var(--accent); }

  .form-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .examples { font-size: 12px; color: var(--muted); }
  .examples a { margin-right: 12px; }

  /* Cards ------------------------------------------------------------------ */
  .card {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 20px; margin-bottom: 16px;
    box-shadow: var(--shadow-sm);
  }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }

  /* Verdict badges --------------------------------------------------------- */
  .verdict {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 6px; font-weight: 700; font-size: 11px; letter-spacing: 0.5px;
  }
  .verdict.BUY        { background: var(--green-soft); color: var(--green); }
  .verdict.ACCUMULATE { background: var(--green-soft); color: var(--green); }
  .verdict.HOLD       { background: var(--yellow-soft); color: var(--yellow); }
  .verdict.REDUCE     { background: var(--orange-soft); color: var(--orange); }
  .verdict.AVOID      { background: var(--red-soft); color: var(--red); }

  /* Color helpers ---------------------------------------------------------- */
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .neutral { color: var(--muted); }

  /* Grid + alerts ---------------------------------------------------------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px 24px; margin-top: 14px; }
  .grid div span { color: var(--muted); display: inline-block; min-width: 130px; }

  .alert {
    background: var(--yellow-soft); color: var(--yellow);
    border-left: 3px solid var(--yellow-bright);
    padding: 10px 14px; border-radius: var(--radius-sm); margin: 10px 0; font-size: 13px;
    display: flex; align-items: flex-start; gap: 8px;
  }
  .alert [data-lucide] { flex-shrink: 0; margin-top: 1px; }

  .rationale { background: var(--panel-soft); border-radius: var(--radius-sm); padding: 12px 16px; margin-top: 12px; font-size: 13px; color: var(--text-soft); }
  .rationale ul { margin: 4px 0; padding-left: 20px; }
  .rationale li { margin: 4px 0; }
  .rationale b { color: var(--text); }

  .scores { display: flex; gap: 24px; margin-top: 8px; font-size: 13px; flex-wrap: wrap; }
  .scores .s { color: var(--muted); display: inline-flex; align-items: baseline; gap: 4px; }
  .scores .s b { color: var(--text); font-weight: 600; }

  .errors { background: var(--red-soft); color: var(--red); padding: 10px 14px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 13px; }

  .disclaimer { color: var(--muted-soft); font-size: 11px; margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 6px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
  .topbar form { flex: 1; min-width: 280px; }

  .pill { background: var(--panel-soft); border: 1px solid var(--border); padding: 2px 8px; border-radius: 5px; font-size: 11px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }

  /* Tables ------------------------------------------------------------------ */
  table { border-color: var(--border-soft); }
  th { color: var(--muted); }

  /* Lucide icon sizing ----------------------------------------------------- */
  [data-lucide] { width: 16px; height: 16px; stroke-width: 2; vertical-align: -3px; }
  .icon-sm [data-lucide] { width: 14px; height: 14px; }
  .icon-lg [data-lucide] { width: 20px; height: 20px; }
  .icon-xl [data-lucide] { width: 28px; height: 28px; }

  /* Subtle entrance -------------------------------------------------------- */
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .card, .pick { animation: fadeInUp 0.22s ease-out both; }
</style>
</head>
<body>

<a href="#main-content" class="skip-link">Skip to content</a>

<header class="app-header">
  <div class="app-header-inner">
    <a href="/" class="brand" aria-label="Stock Analyzer home">
      <span class="brand-mark" aria-hidden="true"><i data-lucide="line-chart"></i></span>
      Stock Analyzer <span class="ver">2.0</span>
    </a>
    <div class="header-right">
      <nav class="nav-links" aria-label="Primary">
        <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}" {% if request.path == '/' %}aria-current="page"{% endif %}><i data-lucide="layout-dashboard" aria-hidden="true"></i>Recommendations</a>
        <a href="/market" class="nav-link {% if request.path.startswith('/market') %}active{% endif %}" {% if request.path.startswith('/market') %}aria-current="page"{% endif %}><i data-lucide="activity" aria-hidden="true"></i>Market Pulse</a>
        <a href="/fno" class="nav-link {% if request.path.startswith('/fno') %}active{% endif %}" {% if request.path.startswith('/fno') %}aria-current="page"{% endif %}><i data-lucide="candlestick-chart" aria-hidden="true"></i>F&amp;O</a>
        <a href="/screener" class="nav-link {% if request.path.startswith('/screener') %}active{% endif %}" {% if request.path.startswith('/screener') %}aria-current="page"{% endif %}><i data-lucide="filter" aria-hidden="true"></i>Screener</a>
        <a href="/accuracy" class="nav-link {% if request.path.startswith('/accuracy') %}active{% endif %}" {% if request.path.startswith('/accuracy') %}aria-current="page"{% endif %}><i data-lucide="target" aria-hidden="true"></i>Accuracy</a>
        <a href="/analyze" class="nav-link {% if request.path == '/analyze' %}active{% endif %}" {% if request.path == '/analyze' %}aria-current="page"{% endif %}><i data-lucide="search" aria-hidden="true"></i>Analyze</a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
        <i data-lucide="sun" aria-hidden="true"></i><i data-lucide="moon" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>

<main class="wrap" id="main-content">
  {% block content %}{% endblock %}
  <div class="disclaimer" role="note">
    <i data-lucide="info" aria-hidden="true"></i>
    Output is heuristic and may be wrong, stale, or based on incomplete data. Do your own due diligence. Not SEBI-registered. Markets are risky.
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
<script>
  if (window.lucide) { lucide.createIcons(); }

  // ---- Theme toggle. The stamp in localStorage wins over the OS setting;
  // pages with charts read colors at init, so a toggle reloads the page.
  (function () {
    var btn = document.getElementById("theme-toggle");
    if (!btn) return;
    btn.addEventListener("click", function () {
      var isDark = document.documentElement.dataset.theme === "dark" ||
        (!document.documentElement.dataset.theme &&
         window.matchMedia("(prefers-color-scheme: dark)").matches);
      var next = isDark ? "light" : "dark";
      try { localStorage.setItem("sa-theme", next); } catch (e) {}
      document.documentElement.dataset.theme = next;
      location.reload();
    });
  })();

  // ---- Theme-aware color reads for chart code (Chart.js, canvases). -------
  window.cssVar = function (name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  };
  window.isDarkTheme = function () {
    return document.documentElement.dataset.theme === "dark" ||
      (!document.documentElement.dataset.theme &&
       window.matchMedia("(prefers-color-scheme: dark)").matches);
  };

  // Indian number format helpers — used across pages.
  window.fmtINR = function(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const sign = n < 0 ? '-' : '';
    const v = Math.abs(n);
    return sign + v.toLocaleString('en-IN', { maximumFractionDigits: 2 });
  };
  window.fmtINRCompact = function(n) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    const sign = n < 0 ? '-' : '';
    const v = Math.abs(n);
    if (v >= 1e7)  return sign + '₹' + (v / 1e7).toFixed(2) + ' Cr';
    if (v >= 1e5)  return sign + '₹' + (v / 1e5).toFixed(2) + ' L';
    if (v >= 1e3)  return sign + '₹' + (v / 1e3).toFixed(1) + 'k';
    return sign + '₹' + v.toFixed(2);
  };
  window.fmtPct = function(n, withSign) {
    if (n === null || n === undefined || isNaN(n)) return '—';
    return ((withSign && n > 0) ? '+' : '') + n.toFixed(2) + '%';
  };
</script>
</body>
</html>
