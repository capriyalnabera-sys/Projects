<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wedding_AP · Planner</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="initials" id="brandInitials">A &amp; P</div>
        <div class="sub" id="brandSub">Wedding planner</div>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>

    <main class="main">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="btn small menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
          <div>
            <h1 id="pageTitle">Dashboard</h1>
            <div class="hint" id="pageHint"></div>
          </div>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn small" id="addBtn" style="display:none" onclick="openForm()">+ Add</button>
          <a class="btn small" href="/api/export.xlsx" title="Download the whole plan as one Excel/Google Sheets workbook">⬇ Excel</a>
          <button class="btn small ghost" onclick="logout()">Sign out</button>
        </div>
      </div>
      <div class="content" id="content"></div>
    </main>
  </div>

  <div class="modal-back" id="modalBack">
    <div class="modal">
      <header><h2 id="modalTitle">Edit</h2><button class="btn ghost small" onclick="closeModal()">✕</button></header>
      <div class="body" id="modalBody"></div>
      <div class="footer" id="modalFooter"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
