    :root{
      --ink:#3a2b2b; --muted:#8b7d76; --bg:#fbf6f0; --card:#ffffff;
      --accent:#9c294b; --accent-soft:#f6e7ec; --gold:#b8892b; --line:#ece0d4;
    }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--bg);color:var(--ink);
      font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.6;}
    .serif{font-family:'Cormorant Garamond',Georgia,serif;}
    .wrap{max-width:680px;margin:0 auto;padding:0 18px 60px;}
    a{color:var(--accent);}

    /* Hero */
    .hero{position:relative;text-align:center;padding:64px 20px 54px;
      background:radial-gradient(120% 120% at 50% 0%, #fff 0%, var(--accent-soft) 100%);
      border-bottom:1px solid var(--line);overflow:hidden;}
    .monogram{position:relative;width:104px;height:104px;border-radius:50%;margin:0 auto 20px;
      border:1px solid rgba(156,41,80,.5);background:radial-gradient(circle at 50% 42%, #fff, #fdf3f7);
      display:flex;align-items:center;justify-content:center;}
    .monogram::after{content:'';position:absolute;inset:7px;border-radius:50%;border:1px solid rgba(156,41,80,.3);}
    .monogram .mono{position:relative;z-index:1;font-family:'Pinyon Script',cursive;font-size:52px;line-height:1;color:var(--accent);padding-top:10px;white-space:nowrap;}
    .pre{letter-spacing:.35em;text-transform:uppercase;font-size:11px;color:var(--muted);}
    .names{font-family:'Cormorant Garamond',serif;font-size:58px;line-height:1.05;margin:10px 0;color:var(--ink);font-weight:600;}
    .names .amp{color:var(--accent);font-style:italic;font-weight:400;}
    .tagline{font-style:italic;color:var(--muted);font-family:'Cormorant Garamond',serif;font-size:21px;}
    .wed-date{margin-top:16px;font-size:15px;letter-spacing:.04em;}

    .countdown{display:flex;justify-content:center;gap:14px;margin-top:26px;flex-wrap:wrap;}
    .cd{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-width:70px;}
    .cd b{font-family:'Cormorant Garamond',serif;font-size:30px;display:block;color:var(--accent);line-height:1;}
    .cd span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);}

    .greeting{text-align:center;margin:44px 0 8px;}
    .greeting .hi{font-family:'Cormorant Garamond',serif;font-size:30px;}
    .greeting p{color:var(--muted);max-width:520px;margin:8px auto 0;}

    h2.section{font-family:'Cormorant Garamond',serif;text-align:center;font-size:34px;margin:48px 0 6px;font-weight:600;}
    .section-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:22px;}

    /* Event cards */
    .event{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-bottom:16px;
      box-shadow:0 6px 20px rgba(90,50,40,.05);position:relative;}
    .event.invited{border-left:4px solid var(--accent);}
    .event .badge{position:absolute;top:16px;right:16px;background:var(--accent-soft);color:var(--accent);
      font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.03em;}
    .event h3{font-family:'Cormorant Garamond',serif;font-size:26px;margin:0 0 4px;}
    .event .when{color:var(--accent);font-weight:500;font-size:14px;}
    .event .meta{color:var(--muted);font-size:14px;margin-top:8px;display:grid;gap:3px;}
    .event .meta b{color:var(--ink);font-weight:500;}
    .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid rgba(0,0,0,.1);}

    /* RSVP */
    .rsvp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;margin-top:10px;box-shadow:0 6px 20px rgba(90,50,40,.05);}
    .rsvp label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;}
    .rsvp input,.rsvp select,.rsvp textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);}
    .rsvp textarea{min-height:70px;resize:vertical;}
    .choices{display:flex;gap:10px;flex-wrap:wrap;}
    .choice{flex:1;min-width:90px;text-align:center;padding:12px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s;background:#fff;}
    .choice.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;}
    .fn-rsvp{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
    .fn-rsvp:last-child{border-bottom:none;}
    .fn-rsvp .toggle{display:flex;gap:6px;}
    .mini{padding:6px 12px;border:1.5px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px;background:#fff;}
    .mini.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600;}
    .btn-submit{width:100%;margin-top:22px;padding:14px;background:var(--accent);color:#fff;border:none;border-radius:12px;
      font-size:16px;font-family:'Cormorant Garamond',serif;letter-spacing:.03em;cursor:pointer;}
    .btn-submit:hover{background:#82203e;}
    .hidden{display:none;}

    .details{text-align:center;margin-top:40px;color:var(--muted);font-size:14px;}
    .details .hash{color:var(--accent);font-size:20px;font-family:'Cormorant Garamond',serif;margin-top:8px;}
    .footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;}
    .thanks{text-align:center;padding:60px 20px;}
    .thanks .big{font-family:'Cormorant Garamond',serif;font-size:40px;color:var(--accent);}
    .loading,.error{text-align:center;padding:90px 20px;color:var(--muted);font-family:'Cormorant Garamond',serif;font-size:24px;}
    @media(max-width:520px){ .names{font-size:44px;} }

    /* Floral / botanical decorations */
    .hero-inner{position:relative;z-index:2;}
    .floral{position:absolute;pointer-events:none;z-index:1;}
    .floral-tl{left:-30px;top:-34px;width:220px;height:220px;opacity:.82;}
    .floral-tr{right:-30px;top:-34px;width:220px;height:220px;opacity:.82;transform:scaleX(-1);}
    .bg-fl-br{position:fixed;right:-48px;bottom:-48px;width:300px;height:300px;opacity:.07;transform:rotate(178deg);z-index:0;}
    .divider-fl{display:block;margin:36px auto 4px;width:190px;height:38px;}
    .footer-sprig{display:block;margin:18px auto 2px;width:120px;height:30px;opacity:.75;}
    @media(max-width:520px){ .floral-tl,.floral-tr{width:150px;height:150px;} }

    /* Story / gallery / travel / blessings */
    .story{max-width:600px;margin:6px auto 0;text-align:center;}
    .story p{color:var(--ink);opacity:.86;font-size:15.5px;line-height:1.85;margin:0 0 12px;}
    .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px;}
    .gallery img,.gallery .ph{aspect-ratio:3/4;width:100%;object-fit:cover;border-radius:14px;border:1px solid var(--line);box-shadow:0 6px 20px rgba(90,50,40,.06);}
    .gallery .ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#fbeef3,#f3d9e2);}
    @media(max-width:520px){ .gallery{grid-template-columns:repeat(2,1fr);} }
    .info-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:0 6px 20px rgba(90,50,40,.05);max-width:600px;margin:0 auto;}
    .info-card p{white-space:pre-line;color:var(--ink);opacity:.86;line-height:1.85;margin:0;}
    .blessing{max-width:560px;margin:0 auto;text-align:center;}
    .blessing .icon{font-size:30px;line-height:1;}
    .blessing p{color:var(--ink);opacity:.86;line-height:1.8;font-size:15.5px;margin-top:8px;}

    /* Music toggle */
    .music-btn{position:fixed;bottom:20px;left:20px;z-index:150;width:46px;height:46px;border-radius:50%;
      border:1px solid var(--line);background:#fff;box-shadow:0 6px 18px rgba(90,50,40,.16);cursor:pointer;
      font-size:18px;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .15s;}
    .music-btn:hover{transform:scale(1.08);}
    .music-btn.playing{background:var(--accent-soft);border-color:var(--accent);}
  </style>
</head>
<body>
  <button class="music-btn" id="musicBtn" onclick="toggleMusic()" aria-label="Play soft background music" title="Play soft music">🎵</button>
  <div id="app"><div class="loading">Loading your invitation…</div></div>

  <script>
    const token = location.pathname.split('/').filter(Boolean).pop();
    let DATA = null;
    const state = { attending: 'yes', fnRsvp: {} };

    function fmtDate(d){
      if(!d) return '';
      const dt = new Date(d + (d.length===10?'T00:00:00':''));
      if(isNaN(dt)) return esc(d);
      return dt.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    }
    function fmtDateRange(a,b){
      if(!a) return '';
      if(!b||b===a) return fmtDate(a);
      const x=new Date(a+(a.length===10?'T00:00:00':'')), y=new Date(b+(b.length===10?'T00:00:00':''));
      if(isNaN(x)||isNaN(y)) return fmtDate(a);
      if(x.getMonth()===y.getMonth()&&x.getFullYear()===y.getFullYear())
        return `${x.getDate()}–${y.getDate()} ${x.toLocaleDateString('en-IN',{month:'long'})} ${x.getFullYear()}`;
      return `${x.toLocaleDateString('en-IN',{day:'numeric',month:'short'})} – ${y.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}`;
    }

    // --- Inline SVG botanical illustrations (self-contained, no external assets) ---
    function fBloom(x,y,s,c1,c2){
      const ring=(rx,ry,fill,dy)=>[0,72,144,216,288].map(a=>`<ellipse cx="0" cy="${dy}" rx="${rx}" ry="${ry}" fill="${fill}" transform="rotate(${a})"/>`).join('');
      return `<g transform="translate(${x},${y}) scale(${s})"><g>${ring(7,12,c1,-12)}</g><g>${ring(3.8,7,c2,-7)}</g><circle r="5" fill="#eab84f"/><circle r="2.3" fill="#d69a2f"/></g>`;
    }
    function fLeaf(x,y,a,s){
      return `<g transform="translate(${x},${y}) rotate(${a}) scale(${s})"><path d="M0 0 C 10 -8 24 -7 33 0 C 24 7 10 8 0 0 Z" fill="#bcd3ad"/><path d="M3 0 L30 0" stroke="#a1bd92" stroke-width="1.3" fill="none" stroke-linecap="round"/></g>`;
    }
    function floralCorner(cls){
      return `<svg class="floral ${cls}" viewBox="0 0 220 220" aria-hidden="true">
        <path d="M20 12 C 80 42 104 104 100 178" stroke="#cf9fb1" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"/>
        <path d="M20 12 C 64 20 112 24 172 14" stroke="#cf9fb1" stroke-width="1.5" fill="none" opacity=".45"/>
        ${fLeaf(60,34,18,1)}${fLeaf(150,20,-6,.82)}${fLeaf(74,76,52,1.05)}${fLeaf(104,128,72,.95)}${fLeaf(46,30,20,.7)}
        ${fBloom(30,34,1.25,'#e6a6c0','#efc6d6')}${fBloom(158,18,1.0,'#d98aa8','#ecb6c9')}${fBloom(98,158,0.82,'#e6a6c0','#efc6d6')}${fBloom(150,46,0.5,'#d98aa8','#ecb6c9')}
      </svg>`;
    }
    function floralDivider(){
      return `<svg class="divider-fl" viewBox="0 0 200 40" aria-hidden="true">
        <path d="M8 20 H72" stroke="#d3a7b6" stroke-width="1.3" opacity=".55"/><path d="M128 20 H192" stroke="#d3a7b6" stroke-width="1.3" opacity=".55"/>
        ${fLeaf(74,20,150,.7)}${fLeaf(126,20,30,.7)}${fBloom(84,20,0.5,'#e6a6c0','#efc6d6')}${fBloom(116,20,0.5,'#e6a6c0','#efc6d6')}${fBloom(100,20,1.0,'#d98aa8','#ecb6c9')}
      </svg>`;
    }
    function floralSprig(){
      return `<svg class="footer-sprig" viewBox="0 0 120 30" aria-hidden="true">${fLeaf(40,15,150,.55)}${fLeaf(80,15,30,.55)}${fBloom(60,15,0.7,'#d98aa8','#ecb6c9')}</svg>`;
    }

    // --- optional invite sections (shown only when the couple fills them in) ---
    function storyBlock(){
      const txt=(DATA.settings.our_story||'').trim(); if(!txt) return '';
      const html=esc(txt).split(/\n+/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${p}</p>`).join('');
      return `${floralDivider()}<h2 class="section">Our Story</h2><div class="story">${html}</div>`;
    }
    function galleryBlock(){
      const urls=(DATA.settings.gallery_urls||'').split(/[\n,]/).map(u=>u.trim()).filter(u=>/^(https?:|data:)/i.test(u)).slice(0,9);
      const tiles = urls.length
        ? urls.map(u=>`<img src="${esc(u)}" alt="" loading="lazy"/>`).join('')
        : [0,1,2].map((_,i)=>`<div class="ph"><svg viewBox="-22 -22 44 44" width="58" height="58" aria-hidden="true">${fBloom(0,0,1.15,i===1?'#d98aa8':'#e6a6c0','#efc6d6')}</svg></div>`).join('');
      return `<h2 class="section">Us, together</h2>
        <div class="section-sub">${urls.length?'A few of our favourite moments 💕':'Cherished moments · photographs to follow 📷'}</div>
        <div class="gallery">${tiles}</div>`;
    }
    function travelBlock(){
      const txt=(DATA.settings.travel_info||'').trim(); if(!txt) return '';
      return `<h2 class="section">Travel &amp; Stay</h2><div class="section-sub">Everything you need to reach us</div>
        <div class="info-card"><p>${esc(txt)}</p></div>`;
    }
    function blessingBlock(){
      const txt=(DATA.settings.gift_note||'').trim(); if(!txt) return '';
      return `<h2 class="section">With Your Blessings</h2><div class="blessing"><div class="icon">💝</div><p>${esc(txt)}</p></div>`;
    }

    // --- background music: soft self-contained synth ambient, or a URL if the couple set one ---
    let _audio=null,_actx=null,_ambTimer=null,_musicOn=false;
    function startAmbient(){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      _actx=new AC();
      const master=_actx.createGain(); master.gain.value=0; master.connect(_actx.destination);
      master.gain.linearRampToValueAtTime(0.16,_actx.currentTime+2);
      const lp=_actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=1500; lp.connect(master);
      const scale=[523.25,587.33,659.25,783.99,880.00,1046.50];
      const pat=[0,2,4,2,1,3,4,5,4,2,1,3]; let i=0;
      const play=()=>{ if(!_actx) return; const t=_actx.currentTime; const f=scale[pat[i%pat.length]];
        const o=_actx.createOscillator(); o.type='sine'; o.frequency.value=f;
        const g=_actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.5,t+0.04); g.gain.exponentialRampToValueAtTime(0.001,t+1.7);
        o.connect(g); g.connect(lp); o.start(t); o.stop(t+1.8); i++; };
      play(); _ambTimer=setInterval(play,640);
    }
    function stopMusic(){
      if(_audio){ try{_audio.pause();}catch(e){} }
      if(_ambTimer){ clearInterval(_ambTimer); _ambTimer=null; }
      if(_actx){ try{_actx.close();}catch(e){} _actx=null; }
    }
    function toggleMusic(){
      if(!DATA) return;
      const btn=document.getElementById('musicBtn'); const url=(DATA.settings.music_url||'').trim();
      if(_musicOn){ stopMusic(); _musicOn=false; if(btn){btn.classList.remove('playing'); btn.textContent='🎵';} return; }
      if(/^https?:\/\//i.test(url)){ if(!_audio){ _audio=new Audio(url); _audio.loop=true; _audio.volume=.5; } _audio.play().catch(()=>{}); }
      else { startAmbient(); }
      _musicOn=true; if(btn){ btn.classList.add('playing'); btn.textContent='🔊'; }
    }
    function fmtTime(t){
      if(!t) return '';
      const [h,m] = t.split(':').map(Number);
      const ap = h>=12?'PM':'AM'; const hh = ((h+11)%12)+1;
      return `${hh}:${String(m||0).padStart(2,'0')} ${ap}`;
    }
    function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function safeUrl(u){ return /^(https?:|mailto:)/i.test(String(u||'').trim()) ? u : '#'; }

    async function load(){
      try{
        const r = await fetch('/public/invite/'+token);
        if(!r.ok) throw new Error('not found');
        DATA = await r.json();
        DATA.functions.filter(f=>f.invited).forEach(f=>{ state.fnRsvp[f.id] = (f.rsvp==='No'?'no':'yes'); });
        render();
      }catch(e){
        document.getElementById('app').innerHTML =
          `<div class="error">This invitation link doesn't seem to be valid.<br><span style="font-size:15px;font-family:Poppins">Please check with the couple for your personal link.</span></div>`;
      }
    }

    function render(){
      const s = DATA.settings, g = DATA.guest;
      const invited = DATA.functions.filter(f=>f.invited);
      const firstDate = (DATA.functions.find(f=>f.event_date)||{}).event_date || s.wedding_date;

      document.getElementById('app').innerHTML = `
        ${floralCorner('bg-fl-br')}
        <div class="hero">
          ${floralCorner('floral-tl')}
          ${floralCorner('floral-tr')}
          <div class="hero-inner">
            <div class="monogram"><span class="mono">${esc(s.couple_initials||'A&P')}</span></div>
            <div class="pre">Together with their families</div>
            <div class="names serif">${esc(s.bride_name||'Bride')} <span class="amp">&amp;</span> ${esc(s.groom_name||'Groom')}</div>
            <div class="tagline">${esc(s.tagline||'request the pleasure of your company')}</div>
            <div class="wed-date">${s.wedding_date_end?fmtDateRange(s.wedding_date||firstDate,s.wedding_date_end):(firstDate?fmtDate(firstDate):'')}</div>
            <div class="countdown" id="cd"></div>
          </div>
        </div>
        <div class="wrap">
          <div class="greeting">
            <div class="hi serif">Dear ${esc(g.name)},</div>
            <p>${esc(s.cover_message||'We would be honoured to have you celebrate with us.')}</p>
          </div>

          ${storyBlock()}
          ${galleryBlock()}

          ${floralDivider()}
          <h2 class="section">Schedule of Events</h2>
          <div class="section-sub">${invited.length?`You're specially invited to ${invited.length} of these`:'The full celebration'}</div>
          ${DATA.functions.map(eventCard).join('') || '<p style="text-align:center;color:var(--muted)">Details coming soon.</p>'}

          ${travelBlock()}

          ${invited.length ? rsvpBlock(g, invited) : ''}

          ${blessingBlock()}

          <div class="details">
            ${s.contact_name?`For any help, contact <b>${esc(s.contact_name)}</b>${s.contact_phone?` · ${esc(s.contact_phone)}`:''}`:''}
            ${s.hashtag?`<div class="hash">${esc(s.hashtag)}</div>`:''}
          </div>
          ${floralSprig()}
          <div class="footer">Made with love · Wedding_AP</div>
        </div>`;

      renderCountdown(firstDate);
      if(invited.length) wireRsvp(invited);
    }

    function eventCard(f){
      return `<div class="event ${f.invited?'invited':''}">
        ${f.invited?'<div class="badge">You\'re invited</div>':''}
        <h3>${esc(f.name)}</h3>
        <div class="when">${fmtDate(f.event_date)}${f.start_time?' · '+fmtTime(f.start_time):''}${f.end_time?' – '+fmtTime(f.end_time):''}</div>
        <div class="meta">
          ${f.venue?`<div><b>${esc(f.venue)}</b></div>`:''}
          ${f.address?`<div>${esc(f.address)}</div>`:''}
          ${f.dress_code?`<div>${f.theme_color?`<span class="dot" style="background:${esc(f.theme_color)}"></span>`:''}Dress code: <b>${esc(f.dress_code)}</b></div>`:''}
          ${f.map_url?`<div><a href="${esc(safeUrl(f.map_url))}" target="_blank" rel="noopener">📍 View on map</a></div>`:''}
          ${f.description?`<div>${esc(f.description)}</div>`:''}
        </div>
      </div>`;
    }

    function rsvpBlock(g, invited){
      return `<h2 class="section">Will you join us?</h2>
        <div class="section-sub">${DATA.settings.rsvp_deadline?'Kindly respond by '+fmtDate(DATA.settings.rsvp_deadline):'We can\'t wait to hear from you'}</div>
        <div class="rsvp" id="rsvp">
          <label>Will you be attending?</label>
          <div class="choices" id="attend">
            <div class="choice" data-v="yes">Joyfully accept ✨</div>
            <div class="choice" data-v="maybe">Maybe</div>
            <div class="choice" data-v="no">Regretfully decline</div>
          </div>
          <div id="yesBlock">
            <label>Which functions will you attend?</label>
            <div id="fnList">
              ${invited.map(f=>`<div class="fn-rsvp"><span>${esc(f.name)}</span>
                <div class="toggle" data-fn="${f.id}">
                  <div class="mini" data-v="yes">Yes</div><div class="mini" data-v="no">No</div>
                </div></div>`).join('')}
            </div>
            <label>Total number of guests (including you)</label>
            <input type="number" id="headcount" min="1" value="${g.headcount||1}"/>
            <label>Meal preference</label>
            <select id="meal">
              ${['','Veg','Non-veg','Jain','Vegan','No preference'].map(o=>`<option value="${o}" ${o===g.meal_preference?'selected':''}>${o||'Select…'}</option>`).join('')}
            </select>
          </div>
          <label>A note, song request or dietary need (optional)</label>
          <textarea id="message" placeholder="Send your blessings, a song you'd love to hear, or any dietary needs…"></textarea>
          <button class="btn-submit serif" onclick="submitRsvp()">Send RSVP</button>
        </div>`;
    }

    function wireRsvp(invited){
      document.querySelectorAll('#attend .choice').forEach(c=>{
        c.onclick=()=>{ state.attending=c.dataset.v;
          document.querySelectorAll('#attend .choice').forEach(x=>x.classList.toggle('on',x===c));
          document.getElementById('yesBlock').classList.toggle('hidden', state.attending==='no');
        };
      });
      document.querySelector('#attend .choice[data-v="yes"]').click();
      document.querySelectorAll('.toggle').forEach(t=>{
        const fn=t.dataset.fn;
        const set=v=>{ state.fnRsvp[fn]=v; t.querySelectorAll('.mini').forEach(m=>m.classList.toggle('on',m.dataset.v===v)); };
        t.querySelectorAll('.mini').forEach(m=>m.onclick=()=>set(m.dataset.v));
        set(state.fnRsvp[fn]||'yes');
      });
    }

    function renderCountdown(date){
      const el=document.getElementById('cd'); if(!el||!date) return;
      const diff = new Date(date+(date.length===10?'T00:00:00':'')) - new Date();
      if(diff<=0){ el.innerHTML=`<div class="cd"><b>♥</b><span>Celebrating now</span></div>`; return; }
      const d=Math.floor(diff/86400000), h=Math.floor(diff/3600000)%24, m=Math.floor(diff/60000)%60;
      el.innerHTML=[[d,'Days'],[h,'Hours'],[m,'Minutes']].map(([n,l])=>`<div class="cd"><b>${n}</b><span>${l}</span></div>`).join('');
    }

    async function submitRsvp(){
      const payload={
        attending: state.attending,
        headcount: Number(document.getElementById('headcount')?.value)||1,
        meal_preference: document.getElementById('meal')?.value||'',
        message: document.getElementById('message')?.value||'',
        functions: Object.entries(state.fnRsvp).map(([function_id,rsvp])=>({function_id:Number(function_id), rsvp: rsvp==='no'?'No':'Yes'}))
      };
      if(state.attending==='no') payload.functions=payload.functions.map(f=>({...f,rsvp:'No'}));
      try{
        const r=await fetch('/public/rsvp/'+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        if(!r.ok) throw new Error();
        const s=DATA.settings;
        document.getElementById('app').innerHTML=`<div class="thanks">
          <div class="monogram" style="margin:0 auto 24px"><span class="mono">${esc(s.couple_initials||'A&P')}</span></div>
          <div class="big">Thank you!</div>
          <p style="color:var(--muted);max-width:420px;margin:12px auto">${state.attending==='no'
            ? 'We\'ll miss you, but thank you for letting us know. Sending you love.'
            : 'Your RSVP is received. We can\'t wait to celebrate with you! 💕'}</p>
          ${s.hashtag?`<div class="hash serif" style="color:var(--accent);font-size:22px">${esc(s.hashtag)}</div>`:''}
        </div>`;
        window.scrollTo(0,0);
      }catch(e){ alert('Something went wrong sending your RSVP. Please try again.'); }
    }

    load();
  </script>
</body>
</html>
